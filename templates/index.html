<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeSplit</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="static/css/style.css" rel="stylesheet" />
    <link rel="icon" href="static\images\WeSplit.png" />
  </head>
  <body class="d-flex align-items-center justify-content-center vh-100">
    {% if not group_url %}
    <div class="group-form">
      <h2>Create a <strong>WeSplit</strong> Group:</h2>
      <form action="/create-group" method="POST">
        <div class="mb-3">
          <label for="groupName" class="form-label">Group Name</label>
          <input
            type="text"
            class="form-control"
            id="groupName"
            name="groupName"
            placeholder="My Group"
            required
          />
          <label for="nameTextarea" class="form-label">Enter Names</label>
          <div class="flex">
            <textarea
              class="form-control w-200"
              id="nameTextarea"
              name="names"
              rows="3"
              aria-describedby="namesHelpText"
              required
            ></textarea>
            <span id="namesHelpText" class="form-text names-helper-text"
              >Enter all the user names (comma separated)</span
            >
          </div>
          <label for="groupDescription" class="form-label"
            >Group Description</label
          >
          <div>
            <textarea
              class="form-control w-200"
              id="groupDescription"
              name="groupDescription"
              rows="3"
            ></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
    {% else %}
    <div class="group-url-box">
      <h1>
        You can access your group using the following link:<br />
        <span><a href="{{ group_url }}">{{ group_url }}</a></span>
      </h1>
      <p>
        <br />You are free to share this url to all the participants of the
        group.
      </p>
    </div>
    {% endif %}
  </body>
</html>
